<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INDICATE — Techno Kollektiv</title>

  <script type="importmap">{
    "imports": {
      "three":           "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/":   "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }</script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>if(!sessionStorage.getItem('indicate_auth')){document.documentElement.classList.add('pw-lock')}</script>

  <link rel="stylesheet" href="shared.css" />
  <style>
    body { overflow: hidden; height: 100vh; }

    /* ── 3D CANVAS ── */
    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── OVERLAY ── */
    .hero-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Logo: fade in as whole */
    #hero-logo-svg {
      animation: hero-logo-in 1s ease-out 0.3s both;
    }
    @keyframes hero-logo-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Wordmark: fade in */
    #hero-logo-text {
      animation: logo-text-in 0.7s ease-out 1s both;
    }
    @keyframes logo-text-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .hero-logo {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-glow {
      position: absolute;
      width: 140%;
      height: 140%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(224,0,0,0.35) 0%, rgba(180,0,0,0.15) 40%, transparent 70%);
      filter: blur(30px);
      animation: hero-glow-pulse 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes hero-glow-pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.95); }
      50%      { opacity: 1.0; transform: scale(1.1); }
    }

    .hero-logo-svg {
      position: relative;
      width: clamp(160px, 22vw, 300px);
      height: auto;
      animation: hero-svg-glow 3s ease-in-out infinite, hero-logo-in 1s ease-out 0.3s both;
    }
    @keyframes hero-svg-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.1)) drop-shadow(0 0 50px rgba(224,0,0,0.3)); }
      50%      { filter: drop-shadow(0 0 30px rgba(255,255,255,0.25)) drop-shadow(0 0 90px rgba(224,0,0,0.6)); }
    }

    .hero-sub {
      font-size: 0.62rem;
      letter-spacing: 0.55em;
      color: var(--grey);
      margin-top: 1.8rem;
      display: flex;
      align-items: center;
      gap: 1.4rem;
      opacity: 0;
    }

    .hero-sub-sep {
      width: 32px;
      height: 1px;
      background: var(--red);
      display: inline-block;
      flex-shrink: 0;
    }

    .hero-cta {
      margin-top: 3rem;
      display: flex;
      gap: 2rem;
      pointer-events: all;
      opacity: 0;
    }

    .hero-btn {
      font-family: var(--font-body);
      font-size: 0.6rem;
      letter-spacing: 0.38em;
      color: var(--white);
      padding: 0.85rem 2rem;
      border: 1px solid rgba(255,255,255,0.25);
      transition: border-color 0.25s, color 0.25s, background 0.25s;
      cursor: pointer;
    }

    .hero-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .hero-btn.primary {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
    }

    .hero-btn.primary:hover {
      background: transparent;
      color: var(--red);
    }

    /* Bottom meta strip */
    .hero-bottom {
      position: fixed;
      bottom: 1.8rem;
      left: 2.8rem;
      right: 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
    }

    .hero-bottom-left {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--grey-dim);
      line-height: 2;
    }

    .hero-bottom-right {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--grey-dim);
      text-align: right;
    }

    .beat-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      margin-right: 0.5rem;
      vertical-align: middle;
      animation: beat 0.5s ease-in-out infinite alternate;
    }

    @keyframes beat {
      from { transform: scale(0.6); opacity: 0.4; }
      to   { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- PAGE TRANSITION OVERLAY -->
  <div class="page-transition in">
    <span class="page-transition-label">INDICATE</span>
  </div>

  <!-- 3D CANVAS -->
  <canvas id="scene-canvas"></canvas>

  <!-- NAV -->
  <nav class="nav">
    <a href="index.html" class="nav-logo" data-transition>
      <img src="logo-mark.svg" alt="INDICATE" class="nav-logo-img">
    </a>
    <ul class="nav-links">
      <li><a href="events.html" data-transition>EVENTS</a></li>
      <li><a href="collective.html" data-transition>KOLLEKTIV</a></li>
    </ul>
  </nav>

  <!-- HERO OVERLAY -->
  <div class="hero-overlay">
    <div class="hero-logo" aria-label="INDICATE">
      <div class="hero-logo-glow"></div>
      <svg id="hero-logo-svg" viewBox="0 0 200 232" xmlns="http://www.w3.org/2000/svg" class="hero-logo-svg">
        <rect x="0" y="0" width="44" height="200" fill="#ffffff"/>
        <path d="M 52,0 L 118,0 C 178,0 196,44 196,100 C 196,156 178,200 118,200 L 52,200 Z
                 M 52,44 L 108,44 C 152,44 156,68 156,100 C 156,132 152,156 108,156 L 52,156 Z"
              fill="#ffffff" fill-rule="evenodd"/>
        <text id="hero-logo-text" x="92" y="226" font-family="Space Mono, monospace" font-size="12.5"
              letter-spacing="11" fill="rgba(255,255,255,0.88)" text-anchor="middle">INDICATE</text>
      </svg>
    </div>

    <div class="hero-sub">
      <span>TECHNO KOLLEKTIV</span>
      <span class="hero-sub-sep"></span>
      <span>MÜNCHEN</span>
      <span class="hero-sub-sep"></span>
      <span>2025</span>
    </div>

    <div class="hero-cta">
      <a href="events.html" class="hero-btn primary" data-transition>UPCOMING EVENTS</a>
      <a href="collective.html" class="hero-btn" data-transition>DAS KOLLEKTIV</a>
    </div>
  </div>

  <!-- BOTTOM META -->
  <div class="hero-bottom">
    <div class="hero-bottom-left">
      <span class="beat-pulse"></span>INDICATE — EST. 2025<br>
      MÜNCHEN UNDERGROUND
    </div>
    <div class="hero-bottom-right">
      NEXT EVENT<br>
      14.06.2026
    </div>
  </div>

  <div class="legal-bar">
    <a href="impressum.html">IMPRESSUM</a>
    <div class="legal-bar-sep"></div>
    <a href="datenschutz.html">DATENSCHUTZ</a>
  </div>

  <script src="shared.js"></script>
  <script src="password.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
